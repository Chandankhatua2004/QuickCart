[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle Next.js routing
[[redirects]]
  from = "/admin-dashboard"
  to = "/admin-dashboard"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart"
  status = 200

[[redirects]]
  from = "/my-orders"
  to = "/my-orders"
  status = 200

[[redirects]]
  from = "/payment"
  to = "/payment"
  status = 200

[[redirects]]
  from = "/add-address"
  to = "/add-address"
  status = 200

[[redirects]]
  from = "/all-products"
  to = "/all-products"
  status = 200

[[redirects]]
  from = "/product/*"
  to = "/product/:splat"
  status = 200

# API routes
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()" 